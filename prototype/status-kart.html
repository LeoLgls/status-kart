<meta charset="utf-8">
<title>Status Kart</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@500;700&display=swap">
<style>
/* Layout : une seule scène arcade 16:9, le panneau de question flotte dans le ciel (sous la scène sur mobile). */
:root {
  color-scheme: dark;
  --night: #0c0f24;
  --frame: #05060f;
  --panel: rgba(14, 18, 52, 0.9);
  --ink: #f3f5ff;
  --muted: #9aa3d1;
  --sign: #1f5fd6;
  --sign-edge: #9fc2ff;
  --gold: #ffd23f;
  --good: #3ddc84;
  --bad: #ff5a5a;
  --font-pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
  --font-body: "Rubik", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
body {
  background: var(--night);
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 12px; }
/* --u : pixels d'écran par pixel du jeu (posé par le script). Le HUD, le panneau de question et les
   messages suivent cette échelle pour rester à la même taille par rapport à la piste. */
.game { position: relative; --u: 2; }
.stage {
  /* Le cadre prend la hauteur de l'écran : en paysage au moins en 16:10, en portrait jusqu'au 9:16.
     Le script lit sa taille réelle pour adapter la largeur interne du jeu. */
  position: relative; width: 100%; max-width: 100%; min-height: 220px;
  height: min(calc(100dvh - 96px), calc(min(100vw - 32px, 1280px) / 1.6));
  background: var(--frame); border-radius: 10px; overflow: hidden;
  box-shadow: 0 0 0 3px #1a1f45, 0 18px 40px rgba(0, 0, 0, 0.5);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: pan-y; }
/* Le jeu est dessiné en petit dans #game (invisible, il reçoit toujours les touchers) ; #view montre
   l'image agrandie et bombée, à la résolution de l'écran. */
#game { opacity: 0; }
#view { pointer-events: none; }
.px { font-family: var(--font-pixel); }

.hud {
  position: absolute; top: clamp(6px, calc(var(--u) * 4px), 12px); z-index: 2; pointer-events: none;
  font-family: var(--font-pixel); font-size: clamp(8px, calc(var(--u) * 5.5px), 13px); line-height: 2;
  color: var(--ink); text-shadow: 2px 2px 0 #000; font-variant-numeric: tabular-nums;
}
.hud.l { left: clamp(8px, calc(var(--u) * 4px), 14px); }
.hud.r { right: clamp(8px, calc(var(--u) * 4px), 14px); text-align: right; }
.hud .k { color: var(--gold); }
.hud .combo { color: var(--good); }
.turbo { display: flex; align-items: center; gap: 3px; }
.turbo i { display: inline-block; width: 1.1em; height: 0.9em; background: #2a2f5a; border: 2px solid #000; }
.turbo i:first-of-type { margin-left: 6px; }
.turbo i.on { background: var(--gold); }
.turbo.full i.on { background: var(--good); }

.qpanel {
  position: absolute; z-index: 3; left: 50%; top: clamp(6px, calc(var(--u) * 4px), 12px); transform: translateX(-50%);
  width: min(52%, 500px); background: var(--panel); border: 2px solid var(--ink);
  border-radius: 8px; padding: clamp(6px, calc(var(--u) * 4px), 10px) clamp(8px, calc(var(--u) * 5px), 12px);
  display: grid; gap: clamp(5px, calc(var(--u) * 3px), 8px);
  transition: opacity .2s;
}
.qpanel.off { opacity: 0; pointer-events: none; }
.scenario { margin: 0; font-size: clamp(12px, calc(var(--u) * 7.5px), 16px); font-weight: 700; line-height: 1.35; text-wrap: balance; min-height: 2.7em; }
.chips { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.chip {
  font-family: var(--font-pixel); font-size: clamp(8px, calc(var(--u) * 6px), 13px); text-align: center;
  padding: clamp(5px, calc(var(--u) * 3px), 8px) 4px; background: var(--sign); border: 2px solid var(--sign-edge); border-radius: 6px;
  color: var(--ink); transition: background .15s, opacity .15s, transform .15s;
}
.chip .arr { display: block; font-size: .7em; color: var(--sign-edge); margin-bottom: 4px; }
.chip.sel { background: var(--gold); color: #1a1400; border-color: var(--ink); transform: translateY(-2px); }
.chip.sel .arr { color: #6b5200; }
.locked .chip:not(.sel) { opacity: .4; }
.chip.ok { background: var(--good); color: #062612; border-color: var(--ink); opacity: 1; }
.chip.ko { background: var(--bad); color: #2a0606; border-color: var(--ink); }
.lockline { font-family: var(--font-pixel); font-size: clamp(7px, calc(var(--u) * 4.5px), 10px); color: var(--muted); text-align: center; min-height: 1.4em; }
.locked .lockline { color: var(--gold); }

.toast {
  position: absolute; z-index: 2; left: 50%; top: 60%; transform: translate(-50%, -50%);
  width: min(90%, 560px); text-align: center; pointer-events: none; opacity: 0; transition: opacity .2s;
}
.toast.show { opacity: 1; }
.toast .big { font-family: var(--font-pixel); font-size: clamp(12px, calc(var(--u) * 10px), 26px); text-shadow: 3px 3px 0 #000; }
.toast.good .big { color: var(--gold); }
.toast.bad .big { color: var(--bad); }
.toast .small {
  display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 6px;
  background: rgba(0, 0, 0, .72); font-size: clamp(11px, calc(var(--u) * 6px), 15px); line-height: 1.4;
}
/* Bannière d'arrivée : elle surgit en tournant, puis flotte doucement. */
.finish {
  position: absolute; z-index: 2; left: 0; right: 0; top: 20%; text-align: center; pointer-events: none;
  font-family: var(--font-pixel); font-size: clamp(28px, calc(var(--u) * 24px), 80px); line-height: 1.2;
  color: var(--gold); text-shadow: 4px 4px 0 #b33, 7px 7px 0 #000;
  animation: finish-pop .6s cubic-bezier(.2, 1.6, .4, 1) both, finish-bob 1.1s ease-in-out .6s infinite alternate;
}
@keyframes finish-pop { from { transform: scale(0) rotate(-10deg); } to { transform: scale(1) rotate(0deg); } }
@keyframes finish-bob { from { transform: translateY(0); } to { transform: translateY(-6px); } }
.count {
  position: absolute; z-index: 2; inset: 0; display: grid; place-items: center; pointer-events: none;
  font-family: var(--font-pixel); font-size: clamp(28px, calc(var(--u) * 30px), 80px); color: var(--gold); text-shadow: 4px 4px 0 #000;
}

.overlay {
  position: absolute; z-index: 5; inset: 0; display: flex; padding: 14px;
  background: rgba(6, 8, 24, .82); text-align: center; overflow-y: auto;
  container-type: size;
}
/* Résultats après l'arrivée : on voit la fête derrière, le texte reste sur un panneau. */
.overlay.celebrate { background: rgba(6, 8, 24, .3); }
.overlay.celebrate > .card { background: var(--panel); border: 2px solid var(--ink); border-radius: 8px; padding: clamp(16px, calc(var(--m) * 2.4), 32px); }
/* margin: auto centre le menu, et s'il est plus haut que le cadre il reste lisible en défilant. */
.overlay > .card { margin: auto; }
/* Les menus suivent la taille de la fenêtre de menu : --m vaut 1,4 % de sa largeur, sans dépasser
   1,6 % de sa hauteur, pour qu'un écran bas et large ne donne pas des titres trop gros. */
.card { --m: min(1.4cqw, 1.6cqh); max-width: 560px; display: grid; gap: clamp(8px, calc(var(--m) * 1.2), 14px); justify-items: center; }
.card h1, .card h2 { margin: 0; font-family: var(--font-pixel); color: var(--gold); text-shadow: 3px 3px 0 #b33; line-height: 1.4; text-wrap: balance; }
.card h1 { font-size: clamp(16px, calc(var(--m) * 3.4), 36px); }
.card h2 { font-size: clamp(14px, calc(var(--m) * 2.4), 24px); }
.card p { margin: 0; font-size: clamp(11px, calc(var(--m) * 1.55), 16px); line-height: 1.5; color: var(--ink); }
.card .muted { color: var(--muted); }
.rules { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: clamp(11px, calc(var(--m) * 1.5), 15px); text-align: left; }
.rules b.g { color: var(--good); }
.rules b.r { color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(3, auto); gap: 6px 18px; font-family: var(--font-pixel); font-size: clamp(8px, calc(var(--m) * 1.2), 12px); line-height: 1.8; }
.stats span { color: var(--muted); display: block; }
.misses { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 13px; text-align: left; max-height: 140px; overflow-y: auto; width: 100%; }
.misses b { color: var(--bad); font-family: var(--font-pixel); font-size: 10px; }
/* Boutons d'arcade en pixel art : bande claire en haut de la face,
   bande sombre en bas, tranche épaisse dessous et ombre portée nette.
   Couleur de rôle fixe : jaune = action principale, bleu (.alt) = action secondaire.
   - normal : le bouton complet, tranche de 8 px ;
   - survol (souris ou sélection au clavier) : la face monte de 4 px et la tranche s'allonge
     d'autant, le bouton devient plus haut au lieu de flotter ;
   - appuyé : le bouton s'enfonce entièrement dans sa tranche. */
button {
  --face: #ffd23f; --hi: #fff1a8; --lo: #d6a10f; --edge: #946800; --line: #0b0d1f; --label: #231a00;
  font-family: var(--font-pixel); font-size: clamp(10px, 1.4vw, 13px); color: var(--label);
  background: var(--face); border: 0; border-radius: 6px;
  padding: 19px 21px; cursor: pointer; outline: none;
  box-shadow: inset 0 4px 0 var(--hi), inset 0 -6px 0 var(--lo),
              0 8px 0 var(--edge), 0 13px 0 rgba(0, 0, 0, .35);
  transition: transform .09s, box-shadow .09s;
}
button.alt { --face: #3e49b0; --hi: #7682e6; --lo: #2b3486; --edge: #191f5e; --label: #ffffff; }
button:hover, button:focus-visible, .card button:focus, .sel button:focus {
  transform: translateY(-4px);
  box-shadow: inset 0 4px 0 var(--hi), inset 0 -6px 0 var(--lo),
              0 12px 0 var(--edge), 0 17px 0 rgba(0, 0, 0, .35);
}
button:active, button.is-pressed, .card button:active, .card button.is-pressed, .sel button:active, .sel button.is-pressed {
  transform: translateY(8px);
  box-shadow: inset 0 5px 0 var(--lo), 0 5px 0 rgba(0, 0, 0, .35);
}
.card button {
  font-size: clamp(10px, calc(var(--m) * 1.3), 13px);
  padding: clamp(12px, calc(var(--m) * 1.9), 19px) clamp(14px, calc(var(--m) * 2.1), 21px);
}
/* Écran d'accueil, sur le modèle du choix de coupe de Super Circuit : fond bleu clair coupé par un
   grand arc, logo doré, pièces de coupe en diagonale (la sélectionnée grossit), et à droite un grand
   panneau avec le tracé du circuit, ses informations et les boutons. Placé en unités du cadre. */
.overlay.screen { padding: 0; background: #6aa8f5; }
.overlay.screen > .sel { margin: 0; }
.overlay.screen > .card {
  margin: auto; background: #2453c4; border: .8cqh solid #a9d0ff; border-radius: 3cqh;
  padding: clamp(16px, 4cqh, 36px) clamp(16px, 4cqw, 40px); box-shadow: 1cqh 1cqh 0 rgba(10, 30, 90, .3);
}
.sel {
  position: relative; width: 100%; height: 100%; overflow: hidden;
  background: radial-gradient(circle at 12% 62%, #cfe8ff 0 46%, #ffffff 46% 46.8%, #8ec4ff 46.8% 48.5%, #5c9cf0 48.5%);
}
.sel .logo {
  position: absolute; left: 3cqw; top: 4cqh; margin: 0; font-family: var(--font-pixel); font-size: min(10cqh, 4.4cqw); line-height: 1.1;
  color: #ffd23f; text-shadow: .06em .06em 0 #6b3a00, -.06em -.06em 0 #6b3a00, .06em -.06em 0 #6b3a00, -.06em .06em 0 #6b3a00, 0 .14em 0 #c0182a, 0 .22em 0 rgba(0, 0, 0, .25);
}
.sel .sub {
  position: absolute; left: 3.4cqw; top: 18cqh; margin: 0; font-family: var(--font-pixel); font-size: min(3.4cqh, 1.8cqw);
  color: #ffffff; text-shadow: .1em .1em 0 #1d3a8a, -.06em -.06em 0 #1d3a8a, .06em -.06em 0 #1d3a8a, -.06em .06em 0 #1d3a8a;
}
/* Coupes en colonne, le nom à côté de la pièce ; la coupe survolée ou choisie au clavier grossit */
.sel button.cup, .sel button.cup:hover, .sel button.cup:focus, .sel button.cup:active, .sel button.cup.is-pressed {
  position: absolute; left: 16cqw; top: var(--y); height: 14cqh; display: flex; align-items: center; gap: 2.4cqw; padding: 0;
  border: 0; border-radius: 0; background: none; box-shadow: none; transform: translateY(-50%); text-align: left;
}
.cup .ic { position: relative; width: 14cqh; height: 14cqh; flex: none; transition: transform .12s; }
.cup .ic img { width: 100%; height: 100%; image-rendering: pixelated; filter: drop-shadow(.6cqh .6cqh 0 rgba(10, 30, 90, .35)); }
.cup .nm { font-family: var(--font-pixel); font-size: min(3.6cqh, 1.7cqw); line-height: 1.3; color: #ffd23f; text-shadow: .08em .08em 0 #1d3a8a, -.05em -.05em 0 #1d3a8a, .05em -.05em 0 #1d3a8a, -.05em .05em 0 #1d3a8a; }
.cup.k0 { --y: 24cqh; }
.cup.k1 { --y: 40cqh; }
.cup.k2 { --y: 56cqh; }
.cup.k3 { --y: 72cqh; }
.sel button.cup.on .ic { transform: scale(1.3); }
.sel button.cup.on:active .ic, .sel button.cup.on.is-pressed .ic { transform: scale(1.15); }
.cup.locked img { filter: grayscale(1) brightness(.7); }
.cup .lock { position: absolute; left: 50%; top: 50%; width: 42%; transform: translate(-50%, -50%); color: #ffffff; filter: drop-shadow(.3cqh .3cqh 0 #1a1a2e); }
/* Grand panneau de droite : tracé, informations du circuit et boutons */
.course {
  position: absolute; left: 58cqw; right: 3cqw; top: 6cqh; bottom: 6cqh; display: grid; grid-template-rows: 1fr auto; gap: 2.4cqh; padding: 3cqh 3cqw 4cqh;
  background: #2453c4; border: .8cqh solid #a9d0ff; border-radius: 4cqh; box-shadow: inset 0 0 0 .6cqh #1a3f9e, 1cqh 1cqh 0 rgba(10, 30, 90, .3);
}
.course .map { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; min-height: 0; }
.course.locked .map { filter: grayscale(1) brightness(.6); }
.course .lines { display: grid; gap: 1.4cqh; }
.pill {
  font-family: var(--font-pixel); font-size: min(3.6cqh, 2cqw); line-height: 1.5; text-align: center; padding: .4cqh 1cqw;
  background: #4f8ff2; border-radius: 3cqh; color: #ffd23f; text-shadow: .1em .1em 0 #1a2f80;
}
.pill.small { font-size: min(2.6cqh, 1.4cqw); color: #ffffff; background: #3a75de; }
/* Bandeau rouge du joueur : le kart de Toad et le numéro du joueur */
.kart-tab {
  position: absolute; left: 0; bottom: 4cqh; width: 25cqw; height: 13cqh; display: flex; align-items: center; gap: 2cqw; padding-left: 2cqw;
  isolation: isolate;
  font-family: var(--font-pixel); font-size: 7cqh; color: #ffffff; text-shadow: .08em .08em 0 #7a0a0a;
}
/* La flèche est dessinée en SVG : un trait blanc épais puis un trait rouge plus fin, aux angles arrondis,
   ce qui donne un bord blanc régulier tout autour (pointe comprise) ; l'ombre suit la forme. */
.kart-tab svg {
  position: absolute; left: -2cqh; top: 1.5cqh; right: 1.5cqh; bottom: 1.5cqh; width: calc(100% - 3.5cqh + 2cqh); height: calc(100% - 3cqh);
  z-index: -1; overflow: visible; filter: drop-shadow(.6cqh .6cqh 0 rgba(0, 0, 0, .25));
}
.kart-tab path { vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.kart-tab .out { fill: #ffffff; stroke: #ffffff; stroke-width: 3cqh; }
.kart-tab .in { fill: #e2312a; stroke: #e2312a; stroke-width: 1.8cqh; }
.kart-tab img { height: 80%; image-rendering: pixelated; }
/* Onglets bleus collés au bord gauche, empilés juste au-dessus du bandeau rouge : RETOUR (vers le titre)
   et choix du pilote (à brancher plus tard). Au survol l'onglet sort du bord, enfoncé il rentre. */
/* les onglets dépassent un peu à gauche du cadre : leur ombre décalée touche alors le bord */
.tabs { position: absolute; left: -1cqh; bottom: 19cqh; display: grid; justify-items: start; gap: 1.5cqh; }
.sel button.tab, .sel button.tab:hover, .sel button.tab:focus, .sel button.tab:active, .sel button.tab.is-pressed {
  width: calc(11cqw + 1cqh); height: 11cqh; display: grid; place-items: center; padding: 0; background: #2f6fe0;
  border: .6cqh solid #ffffff; border-left: 0; border-radius: 0 1.6cqh 1.6cqh 0; box-shadow: .6cqh .6cqh 0 rgba(0, 0, 0, .25); transform: none;
  font-family: var(--font-pixel); font-size: min(2.6cqh, 1.4cqw); color: #ffffff; text-shadow: .12em .12em 0 #c0182a; transition: width .09s;
}
button.tab img { height: 80%; width: auto; image-rendering: pixelated; }
.sel button.tab:hover, .sel button.tab:focus { width: calc(13cqw + 1cqh); }
.sel button.tab:active, .sel button.tab.is-pressed { width: calc(10cqw + 1cqh); }
/* Choix du pilote : portraits en grille de 4, le nom dessous ; le portrait survolé ou choisi au clavier grossit */
.drivers {
  position: absolute; left: 20cqw; right: 4cqw; top: 20cqh; bottom: 22cqh;
  display: grid; grid-template-columns: repeat(4, 1fr); align-content: center; gap: 4cqh 2cqw;
}
.sel button.drv, .sel button.drv:hover, .sel button.drv:focus, .sel button.drv:active, .sel button.drv.is-pressed {
  display: grid; justify-items: center; gap: 1.6cqh; padding: 0; border: 0; border-radius: 0; background: none; box-shadow: none; transform: none;
}
.drv .ic { width: 18cqh; height: 18cqh; transition: transform .12s; }
.drv .ic img { width: 100%; height: 100%; image-rendering: pixelated; filter: drop-shadow(.6cqh .6cqh 0 rgba(10, 30, 90, .35)); }
.drv .nm { font-family: var(--font-pixel); font-size: min(3cqh, 1.5cqw); color: #ffd23f; text-shadow: .08em .08em 0 #1d3a8a, -.05em -.05em 0 #1d3a8a, .05em -.05em 0 #1d3a8a, -.05em .05em 0 #1d3a8a; }
.sel button.drv:hover .ic, .sel button.drv:focus .ic { transform: scale(1.18); }
.sel button.drv:active .ic, .sel button.drv.is-pressed .ic { transform: scale(1.06); }
/* Titre du choix de la coupe */
.sel .logo.sm { font-size: min(7cqh, 2.8cqw); top: 5cqh; }
/* Écran titre, comme celui de Super Circuit : le ciel du titre, le logo et son bandeau rouge,
   les règles sur des barres rouges arrondies, le bouton JOUER et les pilotes en bas. */
/* Derrière l'écran titre, la vraie scène du jeu : le circuit et Toad sur la ligne de départ. */
.overlay.screen.scene { background: transparent; }
.stage:has(> .overlay.scene) .hud { display: none; }
.ttl {
  background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6cqh;
}
.ttl .logo, .ttl .bars, .ttl .start { position: static; transform: none; }
.ttl .logo { text-align: center; font-size: min(13cqh, 7cqw); }
.ttl .bars {
  width: min(62cqw, 120cqh); display: grid; gap: 1.4cqh; margin: 0;
  padding: 2.6cqh 3cqw; list-style: none; text-align: left; font-size: min(3.2cqh, 1.7cqw); line-height: 1.4; color: #ffffff;
  background: #2453c4; border: .8cqh solid #a9d0ff; border-radius: 3cqh; box-shadow: inset 0 0 0 .6cqh #1a3f9e, 1cqh 1cqh 0 rgba(10, 30, 90, .3);
}
.ttl .bars b.g { color: var(--good); }
.ttl .bars b.r { color: var(--bad); }
.ttl .start { font-size: min(3.2cqh, 1.8cqw); padding: 2.4cqh 6cqw; }
.ttl .start:hover, .ttl .start:focus, .ttl .start:focus-visible { transform: translateY(-4px); }
.ttl .start:active, .ttl .start.is-pressed { transform: translateY(8px); }
/* Écran en hauteur (téléphone) : logo et coupes en haut, panneau dessous */
@container (orientation: portrait) {
  .sel { background: radial-gradient(circle at 50% -12%, #cfe8ff 0 54%, #ffffff 54% 54.8%, #8ec4ff 54.8% 56.5%, #5c9cf0 56.5%); }
  .sel .logo { left: 0; right: 0; text-align: center; top: 4cqh; font-size: 8cqw; }
  .sel .sub { left: 0; right: 0; text-align: center; top: 12cqh; font-size: 3.4cqw; }
  .sel button.cup, .sel button.cup:hover, .sel button.cup:focus, .sel button.cup:active, .sel button.cup.is-pressed { left: 8cqw; height: 9cqh; gap: 4cqw; }
  .cup .ic { width: 9cqh; height: 9cqh; }
  .cup .nm { font-size: 3.6cqw; }
  .cup.k0 { --y: 15cqh; }
  .cup.k1 { --y: 24cqh; }

  // La taille du cadre vient du CSS (hauteur d'écran, paysage ou portrait). Ici on lit sa taille
  // réelle et on donne au canvas exactement les mêmes proportions : pixels carrés, rien n'est étiré.
  const stageEl = document.getElementById('stage'), gameEl = stageEl.parentElement;
  function resizeGame() {
    const width = stageEl.clientWidth, height = stageEl.clientHeight;
    if (!width || !height) return;                       // pas encore mis en page
    const wide = width / height >= BASE_W / BASE_H;
    const nextW = wide ? Math.round(BASE_H * width / height) : BASE_W;
    const nextH = wide ? BASE_H : Math.round(BASE_W * height / width);
    if (nextW !== W || nextH !== H) {
      W = nextW; H = nextH;
      HZ = BASE_HZ + Math.round((H - BASE_H) * 0.6);     // la hauteur en plus va surtout au ciel
      GY = HZ + VS;
      canvas.width = W; canvas.height = H; ctx.imageSmoothingEnabled = false;
      if (state === 'select' || state === 'drivers') paintMenuBackdrop();
    }
    gameEl.style.setProperty('--u', (width / W).toFixed(3));   // pixels d'écran par pixel du jeu
  }

  const queueResize = () => {
    if (resizeQueued) return;
    resizeQueued = true;
    requestAnimationFrame(() => { resizeQueued = false; resizeGame(); });

  if (window.ResizeObserver) new ResizeObserver(queueResize).observe(stageEl);

    });
    addRoad(0, 30, 0, 0);
    segments[12].checker = 1; segments[13].checker = 2;
    questions.forEach((q, i) => {
      q.blockStart = segments.length;
      const arcs = cfg.arcs[i], R = cfg.curve + cfg.approach + cfg.fill;
      let used = 0;
      arcs.forEach(([frac, deg], j) => {
        const n = j === arcs.length - 1 ? R - used : Math.round(R * frac);
        used += n; addArc(n, deg);
      });
      q.lockStart = segments.length;
      // Après l'objet, assez de ligne droite pour lire le verdict à la vitesse de base du niveau.
      const exit = (LOCK - ITEM_AT) + Math.round(cfg.speed * VERDICT_S / SEG);
      addRoad(0, LOCK, 0, 0);
      if (cfg.post[i]) addArc(exit, cfg.post[i]); else addRoad(0, exit, 0, 0);
      for (let n = q.lockStart; n < q.lockStart + LOCK; n++) segments[n].lock = q;
      segments[q.lockStart].gantry = q;
      q.itemSeg = q.lockStart + ITEM_AT;
      for (let l = 0; l < 3; l++) {
        if (l === q.correctLane) {
          for (let n = 0; n < PAD_SEGS; n++) segments[q.itemSeg - 1 + n].boost = { q, lane: l, part: n };
        }
        else segments[q.itemSeg].sprites.push({ img: SPR.shell, offset: LANE_X[l], worldW: 230, q, lane: l, item: true });
      }
    });
    const finish = segments.length + 8;
    addRoad(0, 8, 0, 0);
    // Après l'arrivée, la piste recommence comme au départ (on voit le début du tour suivant).
    for (let k = 0; k < DRAW + 32; k++) addSeg(segments[12 + k].curve);
    segments[finish].checker = 1; segments[finish + 1].checker = 2;
    trackEnd = finish * SEG;
    for (let i = 8; i < segments.length; i += 5 + Math.floor(Math.random() * 6)) {
      const side = Math.random() < 0.5 ? -1 : 1;
      if (cfg.floor !== 'rainbow') segments[i].sprites.push({ bush: true, offset: side * (8.2 + Math.random() * 2.4), worldW: 380 + Math.random() * 260 });   // au-delà de la bordure
    }
    buildGeometry();
    buildMap(finish);
  }

  // Mini-carte : le tracé est recalculé à partir des courbures de la piste, avec le même
  // coefficient que celui qui a servi à fermer les circuits ; un point rouge suit le kart.
  const TURN_K = 0.02, MAP_W = 58, MAP_H = 46;
  let map = null;
  function buildMap(finishSeg) {
    let h = 0, x = 0, y = 0; const pts = [];
    for (let i = 0; i <= finishSeg; i++) { pts.push([x, y]); h += segments[i].curve * TURN_K; x += Math.sin(h); y -= Math.cos(h); }
    const loop = pts.slice(12), xs = loop.map((pt) => pt[0]), ys = loop.map((pt) => pt[1]);
    const minX = Math.min(...xs), minY = Math.min(...ys), spanX = Math.max(...xs) - minX, spanY = Math.max(...ys) - minY;
    const sc = Math.min((MAP_W - 8) / spanX, (MAP_H - 8) / spanY);
    const ox = 4 + (MAP_W - 8 - spanX * sc) / 2, oy = 4 + (MAP_H - 8 - spanY * sc) / 2;
    const toMap = ([px, py]) => [Math.round(ox + (px - minX) * sc), Math.round(oy + (py - minY) * sc)];
    const c = mkCanvas(MAP_W, MAP_H), g = c.getContext('2d'), mp = loop.map(toMap);
    g.fillStyle = '#1b2152'; mp.forEach(([a, b]) => g.fillRect(a - 2, b - 2, 4, 4));   // contour
    g.fillStyle = '#f4f6ff'; mp.forEach(([a, b]) => g.fillRect(a - 1, b - 1, 2, 2));   // piste
    const [sx, sy] = mp[0]; g.fillStyle = '#ffd23f'; g.fillRect(sx - 2, sy - 2, 4, 4); // ligne de départ
    map = { canvas: c, pts: pts.map(toMap) };
  }
  // Mini-carte, dessinée sur l'image affichée (g), en pixels du jeu agrandis k fois.
  function drawMap(g, k) {
    if (!map || !segments.length) return;
    const x0 = W - MAP_W - 6, y0 = H - MAP_H - 6, R = (v) => Math.round(v * k);
    g.drawImage(map.canvas, R(x0), R(y0), R(MAP_W), R(MAP_H));
    const [px, py] = map.pts[Math.max(0, Math.min(map.pts.length - 1, segAt(position + PLAYER_Z).index))];
    g.fillStyle = '#1b2152'; g.fillRect(R(x0 + px - 3), R(y0 + py - 3), R(6), R(6));
    g.fillStyle = '#e2231a'; g.fillRect(R(x0 + px - 2), R(y0 + py - 2), R(4), R(4));
  }

  const segAt = (z) => segments[Math.max(0, Math.min(segments.length - 1, Math.floor(z / SEG)))];

  // Physique partagée par la partie et par la simulation des temps de référence.
  // Chaque bon couloir ajoute un cran de turbo (+7 % de vitesse de croisière, 5 crans max) ;
  // une carapace remet le turbo à zéro. Le boost est une poussée courte par-dessus.
  const TURBO_MAX = 5, TURBO_STEP = 0.07;
  function targetSpeed(cfg, cmb, boosting, spinning) {
    if (spinning) return cfg.speed * 0.3;
    return cfg.speed * (1 + TURBO_STEP * Math.min(cmb, TURBO_MAX)) * (boosting ? 1.35 : 1);
  }
  function accelerate(sp, target, dt) {
    const acc = sp < target ? 2600 : 5600;
    return sp + Math.sign(target - sp) * Math.min(Math.abs(target - sp), acc * dt);
  }
  // Temps pour finir le niveau en ayant toujours juste (ou toujours faux), turbo parti de zéro.
  function simulate(L, allRight) {
    const cfg = LEVELS[L], dt = 1 / 120;
    let pos = 0, sp = 0, cmb = 0, bT = 0, sT = 0, t = 0, qi = 0;
    while (pos + PLAYER_Z < trackEnd && t < 600) {
      const si = Math.floor((pos + PLAYER_Z) / SEG);
      if (qi < questions.length && si >= questions[qi].itemSeg) {
        if (allRight) { cmb++; bT = BOOST; } else { cmb = 0; sT = SPIN; }
        qi++;
      }
      if (bT > 0) bT -= dt;
      if (sT > 0) sT -= dt;
      sp = accelerate(sp, targetSpeed(cfg, cmb, bT > 0, sT > 0), dt);
      pos += sp * dt; t += dt;
    }
    return t;
  }

  // ---------- Rendu ----------
  // Chaque tronçon est posé à sa vraie place sur le circuit, avec le même calcul que la mini-carte
  // (chaque tronçon tourne de curve × TURN_K radians). La caméra est derrière le kart, tournée
  // vers lui, et tout est dessiné depuis ce point de vue : les virages à l'écran sont ceux du tracé.
  const NEAR = 20;
  function buildGeometry() {
    let h = 0, x = 0, z = 0, prev = 0;
    for (const seg of segments) {
      h += seg.curve * TURN_K;
      seg.x = x; seg.z = z; seg.h = h; seg.hp = (prev + h) / 2; prev = h;
      seg.sh = Math.sin(h); seg.ch = Math.cos(h);
      seg.shp = Math.sin(seg.hp); seg.chp = Math.cos(seg.hp);   // direction au raccord avec le tronçon d'avant
      x += SEG * seg.sh; z += SEG * seg.ch;
    }
    segments.end = { x, z, hp: prev };
    buildGround();
  }

  // ---------- Sol : herbe, bordures, route et marquages, calculés pixel par pixel ----------
  // Comme le mode 7 de la GBA : pour chaque pixel du sol, on retrouve sa position sur le terrain,
  // le tronçon de route le plus proche et la distance à son axe, et on en déduit sa couleur.
  // Pas de morceaux à assembler (donc aucun jour entre eux), les bandes d'herbe suivent les
  // virages, et là où deux portions du circuit se rapprochent, chaque pixel appartient à la plus
  // proche : les bandes se rejoignent sur une ligne nette, sans jamais se chevaucher.
  // La grille donne, pour chaque case de 400 unités, le tronçon le plus proche (calculé une fois
  // par niveau) ; chaque pixel affine ensuite sur les tronçons voisins.
  const GRID = 400, GRID_PAD = 30000;
  let ground = null;
  function buildGround() {
    const first = 12, last = Math.min(segments.length - 1, Math.round(trackEnd / SEG) - 1);
    const n = segments.length, mx = new Float64Array(n), mz = new Float64Array(n);
    let minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
    for (let i = first; i <= last; i++) {
      const sg = segments[i];
      mx[i] = sg.x + sg.sh * SEG / 2; mz[i] = sg.z + sg.ch * SEG / 2;
      minX = Math.min(minX, mx[i]); maxX = Math.max(maxX, mx[i]); minZ = Math.min(minZ, mz[i]); maxZ = Math.max(maxZ, mz[i]);
    }
    const x0 = minX - GRID_PAD, z0 = minZ - GRID_PAD;
    const cols = Math.ceil((maxX - minX + 2 * GRID_PAD) / GRID) + 1, rows = Math.ceil((maxZ - minZ + 2 * GRID_PAD) / GRID) + 1;
    const idx = new Int32Array(cols * rows).fill(-1), dist = new Float64Array(cols * rows).fill(Infinity);
    const relax = (k, c, r, i) => {
      if (i < 0) return;
      const d = Math.hypot(x0 + (c + 0.5) * GRID - mx[i], z0 + (r + 0.5) * GRID - mz[i]);
      if (d < dist[k]) { dist[k] = d; idx[k] = i; }
    };
    for (let i = first; i <= last; i++) {
      const c = Math.floor((mx[i] - x0) / GRID), r = Math.floor((mz[i] - z0) / GRID);
      relax(r * cols + c, c, r, i);
    }
    // Deux balayages aller-retour : chaque case hérite du tronçon le plus proche de ses voisines.
    for (let pass = 0; pass < 2; pass++) {
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const k = r * cols + c;
        if (c > 0) relax(k, c, r, idx[k - 1]);
        if (r > 0) {
          relax(k, c, r, idx[k - cols]);
          if (c > 0) relax(k, c, r, idx[k - cols - 1]);
          if (c < cols - 1) relax(k, c, r, idx[k - cols + 1]);
        }
      }
      for (let r = rows - 1; r >= 0; r--) for (let c = cols - 1; c >= 0; c--) {
        const k = r * cols + c;
        if (c < cols - 1) relax(k, c, r, idx[k + 1]);
        if (r < rows - 1) {
          relax(k, c, r, idx[k + cols]);
          if (c < cols - 1) relax(k, c, r, idx[k + cols + 1]);
          if (c > 0) relax(k, c, r, idx[k + cols - 1]);
        }
      }
    }
    ground = { x0, z0, cols, rows, idx, first, last };
  }

  const rgb = (hex) => [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
  const mixRgb = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  // Couleurs rangées en entiers 32 bits (ordre RGBA en mémoire) : un seul accès par pixel.
  const pack = (c) => ((255 << 24) | (Math.round(c[2]) << 16) | (Math.round(c[1]) << 8) | Math.round(c[0])) >>> 0;
  const PAL = {
    grassL: rgb(C.grassL), grassD: rgb(C.grassD), rumbleL: rgb(C.rumbleL), rumbleD: rgb(C.rumbleD),
    roadL: rgb(C.roadL), roadD: rgb(C.roadD), lane: rgb(C.lane), barA: rgb(C.barA), barB: rgb(C.barB),
    white: rgb('#ffffff'), black: rgb('#111111'), padY: rgb('#f8f050'), padR: rgb('#b81010'),
  };
  const PK = Object.fromEntries(Object.entries(PAL).map(([k, v]) => [k, pack(v)]));
  // Plaque d'accélération de Super Circuit : tuile de 16 × 16, flèche rouge sur jaune puis l'inverse.
  const padRed = (y, x) => { const dx = Math.abs(x - 7.5); return y < 8 ? dx < y + 1 : !(dx < y - 8); };
  const RUMBLE_OUT = ROAD_W * (1 + 1 / 7);
  // Sol de Peach Circuit, repris de la carte de Super Circuit : une coupe en travers de la ligne droite
  // (asphalte, ligne blanche du bord, bas-côté vert clair qui fonce vers l'herbe, bordure de triangles
  // colorés), puis un carreau d'herbe pour tout ce qui est au-delà. Le sol est lu dans ces images selon
  // l'écart à l'axe de la route et la distance parcourue, comme le mode 7 de la GBA.
  // En jeu, la carte est vue de très près : 1 pixel de la carte = 48 unités (un kart en fait ~6, comme
  // dans Super Circuit). La ligne blanche commence au bord de notre route, côté extérieur : les
  // trois couloirs restent entièrement sur l'asphalte.
  const FLOOR_PX = 48;
  // Chaque sol : une coupe (colonne = écart à l'axe, ligne = distance le long de la route) dont les
  // colonnes 0 à edge - 1 sont l'intérieur de la route et edge.. le bord extérieur (ligne, liseré,
  // bas-côté...), puis un carreau répété au-delà. bands : la route change de couleur en long
  // (arc-en-ciel), on garde donc ses vraies couleurs même au loin.

      const t = Math.min(1, Math.max(0, (z * z / K - 500) / 700));

        let col = far;
        const k0 = c >= 0 && r >= 0 && c < g.cols && r < g.rows ? g.idx[r * g.cols + c] : -1;
        if (k0 >= 0) {

          // raccord arrière : ces lignes sont partagées entre voisins, donc les bandes d'herbe restent
          // continues aussi loin de la route qu'on veut, sans cassure aux changements de direction.
          let best = Infinity, bj = -1, bf = 0, bl = 0;

  const nextOf = (seg) => segments[seg.index + 1] || segments.end;
  function pathAt(d) {

  // Point de la route : f le long du tronçon (0 = début), u en travers (0 = bord gauche, 1 = bord droit).
  function roadPt(seg, f, u) {

  const PAD_SEGS = 4;

  function drawGantry(seg, c) {
    const s0 = CAM_DEPTH / c.z, [px, py] = screenOf(c);

    const s = p.scale, vy = VS;
    const yTop = p.y - s * 1250 * vy, yBot = p.y - s * 860 * vy;

  // défiler exactement un panorama, on revient donc au même point après 360°. Le ciel, plus court,
  // va deux fois moins vite. Le bas de chaque image tombe sur l'horizon ; si le plus grand décor ne tient pas

    const bg = BG_SETS[level] || BG_SETS[0];

  // Les 25 images de Toad ne sont pas réparties régulièrement : 0 = de dos, 16 = pile de profil

  }

  function drawPlayer() {
    const img = SPR.kart;
    const dw = KART.ready ? Math.round(KART.bw * 1.7) : 64;
    const dh = KART.ready ? Math.round(KART.bh * 1.7) : Math.round(dw * img.height / img.width);
    const bob = speed > 200 ? Math.round(Math.sin(clock * 38) * 0.6 + 0.4) : 0;
    // En course, le bas du kart est 6 px au-dessus de GY. À l'arrivée, il glisse vers sa vraie place :
    // le centre de l'empreinte du kart sur la route (ligne 28 de sa boîte de 34 : à mi-chemin entre

  // Flammes du boost : elles sortent des deux pots d'échappement de Toad
  // (colonnes 12-13 et 24-25 de l'image de dos, juste sous la ligne 30).
  function drawFlames(cx, cy, dw, dh) {
    const s = KART.ready ? dh / KART.bh : 1;

    const pipes = KART.ready ? [12.5, 24.5].map((x) => cx + (x - KART.bw / 2) * s) : [cx - 4, cx + 4];

  function drawParticles(dt) {
    particles = particles.filter((p) => (p.t += dt) < p.life);

  // Monde bombé : l'image entière (ciel, décor, route, kart) est agrandie à la taille de l'écran puis
  // chaque colonne descend d'autant plus qu'elle est loin du centre (courbe en x², 4 % de la hauteur
  // au bord). Le calcul se fait en pixels d'écran, bien plus fins que ceux du jeu : la courbe reste
  // lisse au lieu de casser les lignes à chaque cran. La mini-carte est posée ensuite, droite.
  const BEND = 0.04;
  const view = document.getElementById('view'), vctx = view.getContext('2d');
  const up = mkCanvas(1, 1), uctx = up.getContext('2d');
  let bendCols = null;
  function present() {
    const dpr = window.devicePixelRatio || 1;
    const VW = Math.max(1, Math.round(stageEl.clientWidth * dpr)), VH = Math.max(1, Math.round(stageEl.clientHeight * dpr));
    if (view.width !== VW || view.height !== VH) { view.width = VW; view.height = VH; up.width = VW; up.height = VH; bendCols = null; }
    if (!bendCols) {
      // colonnes regroupées par décalage identique : quelques dizaines de copies par image
      bendCols = [];
      for (let x = 0; x < VW; x++) {
        const d = Math.round(BEND * VH * ((x + 0.5 - VW / 2) / (VW / 2)) ** 2), last = bendCols[bendCols.length - 1];
        if (last && last[2] === d) last[1] = x + 1; else bendCols.push([x, x + 1, d]);

    const top = uctx.getImageData(0, 0, VW, 1).data, seen = new Map();

    for (let i = 0; i < top.length; i += 32) {

      vctx.drawImage(up, x0, 0, x1 - x0, VH - d, x0, d, x1 - x0, VH - d);
      if (d) vctx.fillRect(x0, 0, x1 - x0, d);

  function drawSprite(sp, pt) {
    const img = sp.item ? SPR.shell : sp.bush ? SPR.bush : sp.img;

  function hud() {
    const turbo = Math.min(combo, TURBO_MAX);
    ui.turbo.forEach((cell, i) => cell.classList.toggle('on', i < turbo));
    ui.turboBox.classList.toggle('full', turbo === TURBO_MAX);
    ui.combo.textContent = combo > 0 ? `+${Math.round(TURBO_STEP * 100 * turbo)} % · COMBO ${combo}` : ' ';
    ui.lvl.textContent = `${level + 1}/${LEVELS.length}`;
    ui.qn.textContent = `${Math.min(qIndex + (questions[qIndex] && questions[qIndex].shown ? 1 : 0), PER_LEVEL)}/${PER_LEVEL}`;
  }
  function chips() {
    const q = questions[qIndex] && questions[qIndex].shown ? questions[qIndex] : null;
    ui.chips.forEach((c, i) => c.classList.toggle('sel', !!q && !q.done && lane === i));
  }
  function showQuestion(q) {
    clearTimeout(hideTimer);
    ui.panel.classList.remove('off', 'locked');
    ui.scen.textContent = q.s;
    ui.chips.forEach((c, i) => { c.classList.remove('ok', 'ko'); c.querySelector('.v').textContent = q.opts[i]; });
    ui.lockline.textContent = 'CHOISIS TON COULOIR AVANT LA BARRIERE';
    chips(); hud();
  }
  function lockQuestion() {
    ui.panel.classList.add('locked');
    ui.lockline.textContent = 'COULOIR VERROUILLE';
  }
  function settleQuestion(q, ok) {
    ui.chips.forEach((c, i) => {
      c.classList.remove('sel');
      if (i === q.correctLane) c.classList.add('ok');
      else if (i === q.lane && !ok) c.classList.add('ko');
    });
    ui.lockline.textContent = ok ? 'BON COULOIR' : `LE BON CODE : ${q.a}`;
    if (qIndex >= questions.length - 1) hideTimer = setTimeout(() => ui.panel.classList.add('off'), VERDICT_S * 1000);
  }
  function toast(kind, big, small) {
    ui.toast.className = `toast show ${kind}`;
    ui.toast.querySelector('.big').textContent = big;
    ui.toast.querySelector('.small').textContent = small;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ui.toast.classList.remove('show'), VERDICT_S * 1000);
  }
  function overlay(html, onGo, onRetry) {
    ui.overlay.innerHTML = html;
    ui.overlay.classList.remove('celebrate', 'screen', 'scene');
    ui.overlay.hidden = false;
    const btn = ui.overlay.querySelector('button:not([data-retry])');
    if (btn) { btn.addEventListener('click', onGo, { once: true }); btn.focus({ preventScroll: true }); }
    const retry = ui.overlay.querySelector('[data-retry]');
    if (retry && onRetry) retry.addEventListener('click', onRetry, { once: true });
    // La souris et les flèches partagent la même sélection : survoler sélectionne, sortir désélectionne.
    ui.overlay.querySelectorAll('button').forEach((b) => {
      b.addEventListener('mouseenter', () => b.focus({ preventScroll: true }));
      b.addEventListener('mouseleave', () => { if (document.activeElement === b) b.blur(); });
    });
    overlay.go = onGo;
  }
  function closeOverlay() { ui.overlay.hidden = true; ui.overlay.innerHTML = ''; ui.overlay.classList.remove('celebrate', 'screen', 'scene'); overlay.go = null; }

  // Progression gardée dans ce navigateur : dernier circuit débloqué et record de chaque circuit.
  const PROGRESS_KEY = 'status-kart-progress';
  function readProgress() {
    try {
      const pr = JSON.parse(localStorage.getItem(PROGRESS_KEY));
      if (pr && Array.isArray(pr.best) && Number.isInteger(pr.unlocked)) return pr;
    } catch { /* rien de sauvegardé ou stockage indisponible */ }
    return { unlocked: 0, best: [] };
  }
  function saveProgress(pr) { try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(pr)); } catch { /* stockage indisponible */ } }
  // Tracé de chaque circuit pour les cartes du menu : la mini-carte du jeu, calculée une fois au démarrage.
  const trackThumbs = [], trackMaps = [];
  function buildThumbs() {
    for (let L = 0; L < LEVELS.length; L++) { buildLevel(L); trackThumbs[L] = map.canvas.toDataURL(); trackMaps[L] = bigMap(); }
  }
  // Grand tracé en trait épais, comme sur l'écran de Super Circuit (dessiné petit puis agrandi en pixels).
  function bigMap() {
    const first = 12, last = Math.min(segments.length - 1, Math.round(trackEnd / SEG));
    const pts = []; for (let i = first; i <= last; i += 2) pts.push([segments[i].x, -segments[i].z]);
    const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);
    const minX = Math.min(...xs), minY = Math.min(...ys), w = Math.max(...xs) - minX, h = Math.max(...ys) - minY;
    const CW = 140, CH = 100, pad = 12, sc = Math.min((CW - 2 * pad) / w, (CH - 2 * pad) / h);
    const ox = (CW - w * sc) / 2, oy = (CH - h * sc) / 2;
    const c = mkCanvas(CW, CH), g = c.getContext('2d');
    const path = () => { g.beginPath(); pts.forEach(([x, y], k) => { const X = ox + (x - minX) * sc, Y = oy + (y - minY) * sc; if (k) g.lineTo(X, Y); else g.moveTo(X, Y); }); g.closePath(); };
    g.lineJoin = 'round'; g.lineCap = 'round';
    path(); g.strokeStyle = '#123488'; g.lineWidth = 12; g.stroke();
    path(); g.strokeStyle = '#ffffff'; g.lineWidth = 8; g.stroke();
    path(); g.strokeStyle = '#dceaff'; g.lineWidth = 3; g.stroke();
    const [sx, sy] = pts[0]; g.fillStyle = '#ffd23f'; g.fillRect(Math.round(ox + (sx - minX) * sc) - 3, Math.round(oy + (sy - minY) * sc) - 3, 6, 6);
    return c.toDataURL();
  }

  // ---------- Son ----------
  let actx = null, muted = false, engine = null, noise = null;
  function ensureAudio() {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch { return null; } }
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function sfx(type) {
    if (muted || !ensureAudio()) return;
    const P = {
      boost: ['square', 330, 990, 0.3], hit: ['sawtooth', 320, 50, 0.45], lock: ['square', 700, 700, 0.06],
      bump: ['triangle', 140, 90, 0.08], beep: ['square', 440, 440, 0.12], go: ['square', 880, 880, 0.25],
      move: ['square', 520, 600, 0.04],
    }[type];
    const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
    o.type = P[0]; o.frequency.setValueAtTime(P[1], t); o.frequency.exponentialRampToValueAtTime(P[2], t + P[3]);
    g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + P[3]);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + P[3] + 0.02);
  }

  // Fanfare d'arrivée (mélodie originale) : un arpège qui monte, puis un accord tenu.
  function fanfare() {
    if (muted || !ensureAudio()) return;
    const a = actx, t0 = a.currentTime + 0.05, N = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const play = (list, type, vol) => list.forEach(([m, at, d]) => {
      const o = a.createOscillator(), g = a.createGain();
      o.type = type; o.frequency.value = N(m);
      g.gain.setValueAtTime(0.0001, t0 + at); g.gain.linearRampToValueAtTime(vol, t0 + at + 0.01);
      g.gain.setValueAtTime(vol, t0 + at + d * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t0 + at + d);
      o.connect(g); g.connect(a.destination); o.start(t0 + at); o.stop(t0 + at + d + 0.02);
    });
    play([[72, 0, 0.12], [76, 0.12, 0.12], [79, 0.24, 0.12], [84, 0.36, 0.26], [83, 0.66, 0.12], [84, 0.78, 0.12], [86, 0.9, 0.14], [88, 1.06, 1.0]], 'square', 0.045);
    play([[76, 1.06, 1.0], [79, 1.06, 1.0]], 'square', 0.022);
    play([[48, 0, 0.34], [55, 0.36, 0.28], [60, 0.66, 0.38], [48, 1.06, 1.0]], 'triangle', 0.08);
  }

  // Moteur : deux oscillateurs filtrés et hachés par un LFO ; la hauteur suit la vitesse.
  function startEngine() {
    if (engine || !ensureAudio()) return;
    const a = actx;
    const o1 = a.createOscillator(); o1.type = 'sawtooth';
    const o2 = a.createOscillator(); o2.type = 'square';
    const f = a.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 500; f.Q.value = 3;
    const am = a.createGain(); am.gain.value = 0.7;
    const lfo = a.createOscillator(); lfo.type = 'square';
    const depth = a.createGain(); depth.gain.value = 0.3;
    const vol = a.createGain(); vol.gain.value = 0;
    lfo.connect(depth); depth.connect(am.gain);
    o1.connect(f); o2.connect(f); f.connect(am); am.connect(vol); vol.connect(a.destination);
    o1.start(); o2.start(); lfo.start();
    engine = { o1, o2, f, lfo, vol };
  }
  function updateEngine() {
    if (!engine) return;
    const t = actx.currentTime;
    const on = (state === 'race' || state === 'countdown' || state === 'finish') && !muted;
    const r = Math.min(1.7, speed / 5000);
    const hz = 48 + r * 150 + (boostT > 0 ? 30 : 0);
    engine.o1.frequency.setTargetAtTime(hz, t, 0.06);
    engine.o2.frequency.setTargetAtTime(hz * 0.502, t, 0.06);
    engine.lfo.frequency.setTargetAtTime(hz * 0.25, t, 0.06);
    engine.f.frequency.setTargetAtTime(350 + r * 1500, t, 0.08);
    engine.vol.gain.setTargetAtTime(on ? 0.018 : 0, t, 0.1);
  }
  // Boost : un souffle de bruit qui monte, puis un petit arpège.
  function boostSound() {
    if (muted || !ensureAudio()) return;
    const a = actx, t = a.currentTime;
    if (!noise) {
      noise = a.createBuffer(1, Math.floor(a.sampleRate * 0.7), a.sampleRate);
      const d = noise.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = a.createBufferSource(); src.buffer = noise;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(3200, t + 0.55);
    const g = a.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.16, t + 0.06); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
    src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(t); src.stop(t + 0.7);
    [523, 659, 784, 1047].forEach((hz, i) => {
      const o = a.createOscillator(), og = a.createGain(), s = t + i * 0.055;
      o.type = 'square'; o.frequency.setValueAtTime(hz, s);
      og.gain.setValueAtTime(0.04, s); og.gain.exponentialRampToValueAtTime(0.0001, s + 0.09);
      o.connect(og); og.connect(a.destination); o.start(s); o.stop(s + 0.1);
    });
  }

  // ---------- Déroulé de la partie ----------
  // Écran titre : le logo, les règles du jeu et les pilotes. JOUER mène au choix de la coupe.

  // Choix de la coupe. ← → (ou ↑ ↓) changent de coupe, Entrée ou un clic lancent la course,
  // Échap ou RETOUR reviennent au titre. Une coupe reste verrouillée tant que le circuit
  // d'avant n'a pas été terminé.
  // Kart du pilote vu de dos (image 0), recadré au plus près pour le bandeau rouge.
  function kartImage() {
    if (!KART.ready) return '';
    const c = mkCanvas(KART.fw, KART.fh), g = c.getContext('2d');
    g.drawImage(KART.img, 0, 0, KART.fw, KART.fh, 0, 0, KART.fw, KART.fh);
    const a = g.getImageData(0, 0, KART.fw, KART.fh).data;
    let top = KART.fh;
    for (let i = 3; i < a.length; i += 4) if (a[i]) { top = Math.floor(i / 4 / KART.fw); break; }
    const out = mkCanvas(KART.fw, KART.fh - top);
    out.getContext('2d').drawImage(c, 0, top, KART.fw, KART.fh - top, 0, 0, KART.fw, KART.fh - top);
    return out.toDataURL();
  }
  function kartTab() {
    const kart = kartImage();
    return kart ? `<div class="kart-tab"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="out" d="M0 0H86L100 50L86 100H0Z"/><path class="in" d="M0 0H86L100 50L86 100H0Z"/></svg><img src="${kart}" alt="${KART.driver.name}">1</div>` : '';
  }
  // Fond du choix de la coupe dessiné à la résolution du jeu (W x H) puis agrandi sans lissage :
  // le grand arc a les mêmes gros pixels que la course. Tramage ordonné (Bayer 4x4) pour les dégradés :
  // ombre de l'arc dans le bleu foncé, bleu qui fonce légèrement vers les coins,
  // et zone claire qui se teinte un peu près de l'arc.
  function paintMenuBackdrop() {
    const sel = ui.overlay.querySelector('.sel:not(.ttl)');
    if (!sel) return;
    const portrait = H > W, c = mkCanvas(W, H), g = c.getContext('2d'), img = g.createImageData(W, H), px = new Uint32Array(img.data.buffer);
    const cx = (portrait ? .5 : .12) * W, cy = (portrait ? -.12 : .62) * H;
    const R = Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(x - cx, y - cy)));   // farthest-corner
    const stops = portrait ? [.54, .548, .565] : [.46, .468, .485];
    const col = (hex) => { const n = parseInt(hex.slice(1), 16); return 0xff000000 | (n & 0xff) << 16 | (n & 0xff00) | n >> 16; };
    const C = ['#cfe8ff', '#ffffff', '#8ec4ff', '#5c9cf0', '#bcdcfc', '#4a86de', '#3f78cf'].map(col);
    const B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
    const dith = (t, x, y) => t * 16 > B[(y & 3) * 4 + (x & 3)];   // vrai pour une part t des pixels
    const clamp01 = (v) => Math.max(0, Math.min(1, v));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const d = Math.hypot(x + .5 - cx, y + .5 - cy) / R;
      let c;
      if (d < stops[0]) c = dith(clamp01((d - (stops[0] - .12)) / .12) * .6, x, y) ? C[4] : C[0];
      else if (d < stops[1]) c = C[1];
      else if (d < stops[2]) c = C[2];
      else {
        const k = d - stops[2];
        if (dith(clamp01(1 - k / .025) * .8, x, y)) c = C[6];                       // ombre portée de l'arc
        else {
          c = dith(clamp01((k - .1) / .5) * .35, x, y) ? C[5] : C[3];        // fonce un peu vers les coins
        }
      }
      px[y * W + x] = c;
    }
    g.putImageData(img, 0, 0);
    sel.style.background = `url(${c.toDataURL()}) 0 0 / 100% 100% no-repeat`;
    sel.style.imageRendering = 'pixelated';
  }
  function mainScreen(focusLevel) {
    state = 'select';
    const pr = readProgress();
    const cupsHtml = CUPS.map((c, L) => {
      const open = L <= pr.unlocked;
      return `<button type="button" class="cup k${L}${open ? '' : ' locked'}" data-level="${L}" aria-label="${c.name}${open ? '' : ' (verrouillée)'}"${open ? '' : ' aria-disabled="true"'}>
        <span class="ic"><img src="${c.icon}" alt="">${open ? '' : LOCK_SVG}</span><span class="nm">${c.name.replace(' ', '<br>')}</span></button>`;
    }).join('');
    overlay(`<div class="sel">
      <h2 class="logo sm">CHOISIS UNE COUPE</h2>
      <div class="tabs">
        <button type="button" class="tab" data-retry>RETOUR</button>
        <button type="button" class="tab pilot" aria-label="Choix du pilote"><img src="${KART.driver.face}" alt="${KART.driver.name}"></button>
      </div>
      ${kartTab()}

        <img class="map" alt="">
        <div class="lines"><div class="pill cname"></div><div class="pill small crec"></div></div>
      </div>
    </div>`, null, titleScreen);
    ui.overlay.classList.add('screen');
    paintMenuBackdrop();
    const root = ui.overlay, cups = [...root.querySelectorAll('.cup')];
    const show = (L) => {
      const c = CUPS[L], open = L <= pr.unlocked, b = pr.best[L];
      const course = root.querySelector('.course');
      course.classList.toggle('locked', !open);

        : `RECORD ${b ? b.xp : 0} XP`;

    // Une coupe n'est sélectionnée que sous la souris ou au clavier ; le panneau garde la dernière affichée.
    const select = (L) => { cups.forEach((b, i) => b.classList.toggle('on', i === L)); root.querySelector('.sel').dataset.on = L; show(L); };
    const go = (L) => { if (L > pr.unlocked) { sfx('bump'); return; } startRace(L); };
    cups.forEach((btn, L) => {

  }

  // Choix du pilote : les portraits en grille, le bandeau rouge montre le kart du pilote actuel.
  // Un clic (ou Entrée) choisit le pilote, le garde dans le navigateur et revient au choix de la coupe.

  function startRace(L) {
    startEngine();
    score = 0; correct = 0; answered = 0; maxCombo = 0; totalTime = 0; misses = [];
    closeOverlay();
    startLevel(L);
  }

  // Rejouer un circuit efface ce que l'essai en cours avait rapporté.
  function retryLevel() {
    if (!levelStart) return;
    ({ score, correct, answered, totalTime } = levelStart);
    misses.length = levelStart.misses;
    closeOverlay();
    startLevel(level);
  }

  // Comme dans Mario Kart, la course part directement sur le compte à rebours.
  function startLevel(L) {
    levelStart = { score, correct, answered, totalTime, misses: misses.length };
    level = L; qIndex = 0; combo = 0; orbit = 0; pull = 0; celebrate = false;
    buildLevel(L);
    par = { fast: simulate(L, true), slow: simulate(L, false) };
    levelTime = 0; ui.time.textContent = fmtTime(0);
    position = 0; speed = 0; lane = 1; playerX = 0; boostT = 0; spinT = 0; particles = [];
    ui.panel.classList.add('off');
    hud();
    state = 'countdown'; countT = 3; sfx('beep');
  }

  function resolve(q) {
    q.done = true; answered++; verdictAt = levelTime;
    const ok = q.lane === q.correctLane;
    const name = NAMES[q.a] || '';
    if (ok) {
      combo++; correct++; maxCombo = Math.max(maxCombo, combo);
      boostT = BOOST;
      toast('good', 'BOOST !', `${q.a} ${name} : ${q.e}`);
      boostSound();
    } else {
      const lost = Math.min(combo, TURBO_MAX);
      combo = 0; spinT = SPIN; shake = 0.6;
      misses.push(q);
      const shell = segments[q.itemSeg].sprites.find((sp) => sp.item && sp.lane === q.lane);
      if (shell) shell.gone = true;
      particles.push({ img: SPR.shell, x: W / 2, y: GY - 30, vx: (Math.random() < 0.5 ? -1 : 1) * 90, vy: -160, g: 420, size: 22, t: 0, life: 1.2 });
      for (let i = 0; i < 10; i++) particles.push({ x: W / 2 - 20 + Math.random() * 40, y: GY - 14, vx: (Math.random() - 0.5) * 80, vy: -20 - Math.random() * 40, g: 60, size: 2, color: '#d9d9d9', t: 0, life: 0.7 });
      toast('bad', lost ? `CARAPACE ! TURBO -${lost}` : 'CARAPACE !', `Il fallait ${q.a} ${name} : ${q.e}`);
      sfx('hit');
    }
    settleQuestion(q, ok);
    qIndex++;
    hud();
  }

  // Arrivée façon Mario Kart : le kart freine, « ARRIVÉE ! », fanfare et confettis, puis la caméra
  // fait un demi-tour autour du kart avant le résultat. Entrée, Espace ou un toucher la passent.
  const FINISH_S = 4.2, ORBIT_SPEED = 0.8;   // radians par seconde
  const CONFETTI = ['#ffd23f', '#e2463a', '#3ddc84', '#3f95f2', '#ffffff', '#ff7ad9'];
  const confetto = () => ({
    x: Math.random() * W, y: -4, vx: (Math.random() - 0.5) * 40, vy: 30 + Math.random() * 50, g: 25,
    size: 2 + Math.round(Math.random()), color: CONFETTI[Math.floor(Math.random() * CONFETTI.length)], t: 0, life: 3 + Math.random(),
  });
  function startFinish() {
    state = 'finish'; finT = 0; orbit = 0; pull = 0; celebrate = true;
    ui.panel.classList.add('off');
    ui.finish.hidden = false;
    fanfare();
  }
  function skipFinish() { if (state === 'finish') finT = FINISH_S; }
  function updateFinish(dt) {
    finT += dt;
    speed = Math.max(0, speed - dt * Math.max(1500, speed * 1.4));
    position += speed * dt;
    playerX += (LANE_X[lane] - playerX) * Math.min(1, dt * 10);
    steer = 0; boostT = 0; spinT = 0;
    ui.speed.textContent = Math.round(speed / 30);
    if (!reduceMotion) {
      // La caméra descend un peu (0,2 s → 1,4 s) pour cadrer le kart en entier, posé sur la route.
      const pk = Math.min(1, Math.max(0, (finT - 0.2) / 1.2));
      pull = pk * pk * (3 - 2 * pk);
      // La caméra se met à tourner en douceur après 1 s, puis garde la même vitesse sans s'arrêter.
      const ramp = Math.min(1, Math.max(0, finT - 1));
      orbit += dt * ORBIT_SPEED * ramp * ramp * (3 - 2 * ramp);
      if (finT < 3.4 && Math.random() < 0.6) particles.push(confetto(), confetto());
    }
    if (finT >= FINISH_S) { ui.finish.hidden = true; levelDone(); ui.overlay.classList.toggle('celebrate', !reduceMotion); }
  }

  function levelDone() {
    state = 'levelEnd';
    ui.panel.classList.add('off');
    const lvlCorrect = questions.filter((q) => q.lane === q.correctLane).length;
    // Un sans-faute (ou un tout-faux) a un temps fixé par la physique : on donne directement
    // le maximum (ou 0), sans dépendre des petits écarts d'images entre la partie et la simulation.
    const ratio = lvlCorrect === PER_LEVEL ? 1 : lvlCorrect === 0 ? 0
      : Math.max(0, Math.min(1, (par.slow - levelTime) / (par.slow - par.fast)));
    const xp = Math.round(XP_PER_LEVEL * ratio);
    score += xp; totalTime += levelTime;
    hud();
    // Record du circuit, et circuit suivant débloqué.
    const pr = readProgress(), prev = pr.best[level];
    const better = !prev || xp > prev.xp || (xp === prev.xp && levelTime < prev.time);
    if (better) pr.best[level] = { xp, time: Math.round(levelTime * 10) / 10 };
    const next = level + 1 < LEVELS.length;
    const unlocked = next && pr.unlocked < level + 1;
    if (unlocked) pr.unlocked = level + 1;
    saveProgress(pr);
    const list = misses.map((q) => `<li><b>${q.a}</b> ${q.s}</li>`).join('');
    overlay(`<div class="card">
      <h2>${prev && better ? 'NOUVEAU RECORD !' : `${CUPS[level].circuit.toUpperCase()} TERMINE`}</h2>
      <div class="stats">
        <div><span>TEMPS</span>${fmtSec(levelTime)}</div>
        <div><span>BONS COULOIRS</span>${lvlCorrect} / ${PER_LEVEL}</div>
        <div><span>XP</span>+${xp}</div>
      </div>
      ${unlocked ? `<p>Nouveau circuit débloqué : <b>${CUPS[level + 1].circuit}</b></p>` : ''}
      ${misses.length ? `<p class="muted">À revoir :</p><ul class="misses">${list}</ul>` : ''}
      <div class="btns">
        <button type="button">${next ? 'CIRCUIT SUIVANT' : 'CHOIX DU CIRCUIT'}</button>
        <button type="button" class="alt" data-retry>RECOMMENCER</button>
        ${next ? '<button type="button" class="alt" data-menu>CHOIX DU CIRCUIT</button>' : ''}
      </div>
    </div>`, next ? () => startRace(level + 1) : () => mainScreen(level), retryLevel);
    const menu = ui.overlay.querySelector('[data-menu]');
    if (menu) menu.addEventListener('click', () => mainScreen(level), { once: true });
  }

  function move(d) {
    if (state !== 'race') return;
    const q = questions[qIndex];
    if (q && q.locked && !q.done) { sfx('bump'); shake = Math.max(shake, 0.15); return; }
    const next = Math.max(0, Math.min(2, lane + d));
    if (next !== lane) { lane = next; sfx('move'); chips(); }
  }

  function togglePause() {
    if (state === 'race' || state === 'countdown') {
      prevState = state; state = 'paused';
      overlay(`<div class="card"><h2>PAUSE</h2>
        <div class="btns">
          <button type="button">REPRENDRE</button>
          <button type="button" class="alt" data-retry>RECOMMENCER</button>
          <button type="button" class="alt" data-menu>CHOIX DU CIRCUIT</button>
        </div></div>`, () => { closeOverlay(); state = prevState; }, retryLevel);
      ui.overlay.querySelector('[data-menu]').addEventListener('click', () => {
        ui.count.hidden = true; ui.panel.classList.add('off');
        mainScreen(level);
      }, { once: true });
    } else if (state === 'paused' && overlay.go) {
      overlay.go();
    }
  }

  // ---------- Boucle ----------
  function update(dt) {
    clock += dt;
    shake = Math.max(0, shake - dt * 1.6);
    if (celebrate && state !== 'finish' && !reduceMotion) {
      orbit += dt * ORBIT_SPEED;
      if (Math.random() < 0.15) particles.push(confetto());
    }
    if (state === 'countdown') {
      const before = Math.ceil(countT);
      countT -= dt;
      const now = Math.ceil(countT);
      ui.count.hidden = false;
      ui.count.textContent = countT > 0 ? String(now) : 'GO !';
      if (now !== before) sfx(now > 0 ? 'beep' : 'go');
      if (countT <= -0.5) { ui.count.hidden = true; state = 'race'; }
      return;
    }
    if (state === 'finish') { updateFinish(dt); return; }
    if (state !== 'race') return;

    const cfg = LEVELS[level];
    const pseg = segAt(position + PLAYER_Z);
    const q = questions[qIndex];
    if (q) {
      // Première question : à son virage. Les suivantes : 2,5 s pile après le verdict précédent.
      const due = qIndex === 0 ? pseg.index >= q.blockStart : levelTime - verdictAt >= VERDICT_S;
      if (!q.shown && (due || pseg.index >= q.lockStart)) { q.shown = true; showQuestion(q); }
      if (!q.locked && pseg.index >= q.lockStart) { q.locked = true; q.revealed = true; q.lane = lane; lockQuestion(); sfx('lock'); }
      if (!q.done && pseg.index >= q.itemSeg) resolve(q);
    }

    const target = LANE_X[lane];
    playerX += (target - playerX) * Math.min(1, dt * 10);
    steer = target - playerX;

    if (boostT > 0) boostT -= dt;
    if (spinT > 0) spinT -= dt;
    speed = accelerate(speed, targetSpeed(cfg, combo, boostT > 0, spinT > 0), dt);
    position += speed * dt;
    levelTime += dt;
    ui.time.textContent = fmtTime(levelTime);
    ui.speed.textContent = Math.round(speed / 30);

    if (position + PLAYER_Z >= trackEnd) startFinish();
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    updateEngine();
    render(dt);
    present();
    requestAnimationFrame(frame);
  }

  // ---------- Commandes ----------
  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (state === 'finish' && (k === ' ' || k === 'enter')) { e.preventDefault(); skipFinish(); return; }
    // Sur un écran (pause, fin de niveau...), ↑ ↓ passent d'un bouton à l'autre.
    // Choix du pilote : les flèches se déplacent dans la grille (4 par ligne).
    if (!ui.overlay.hidden && state === 'drivers' && ['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'q', 'a', 'd', 'z', 'w', 's'].includes(k)) {
      const drv = [...ui.overlay.querySelectorAll('.drv')];
      const i = drv.indexOf(document.activeElement);
      const step = { arrowleft: -1, q: -1, a: -1, arrowright: 1, d: 1, arrowup: -4, z: -4, w: -4, arrowdown: 4, s: 4 }[k];
      const j = i < 0 ? Math.max(0, DRIVERS.indexOf(KART.driver)) : i + step;
      if (j >= 0 && j < drv.length && j !== i) { drv[j].focus({ preventScroll: true }); sfx('move'); }
      e.preventDefault();
      return;
    }
    if (!ui.overlay.hidden && state !== 'select' && ['arrowup', 'arrowdown', 'z', 'w', 's'].includes(k)) {
      const btns = [...ui.overlay.querySelectorAll('button')];
      if (btns.length > 1) {
        const i = btns.indexOf(document.activeElement);
        const step = k === 'arrowdown' || k === 's' ? 1 : -1;
        btns[i < 0 ? 0 : (i + step + btns.length) % btns.length].focus();
      }
      e.preventDefault();
      return;
    }
    if (!ui.overlay.hidden && ['arrowleft', 'arrowright', 'q', 'a', 'd'].concat(state === 'select' ? ['arrowup', 'arrowdown', 'z', 'w', 's'] : []).includes(k)) {
      const cups = [...ui.overlay.querySelectorAll('.cup')];
      if (cups.length) {
        const i = cups.indexOf(document.activeElement), step = ['arrowright', 'd', 'arrowdown', 's'].includes(k) ? 1 : -1;
        const j = i < 0 ? +(ui.overlay.querySelector('.sel').dataset.on || 0) : Math.max(0, Math.min(cups.length - 1, i + step));
        if (j !== i) { cups[j].focus({ preventScroll: true }); sfx('move'); }
        e.preventDefault();
        return;
      }
    }
    if (k === 'arrowleft' || k === 'q' || k === 'a') { move(-1); e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { move(1); e.preventDefault(); }
    else if (k === 'escape' && state === 'select') { titleScreen(); e.preventDefault(); }
    else if (k === 'escape' && state === 'drivers') { mainScreen(); e.preventDefault(); }
    else if (k === 'p' || k === 'escape') { togglePause(); e.preventDefault(); }
    else if (k === 'm') toggleMute();
    else if ((k === ' ' || k === 'enter') && !ui.overlay.hidden) {
      // Entrée / Espace enfoncent le bouton sélectionné (ou le bouton principal) ;
      // l'action part au relâchement, pour qu'on voie le bouton s'enfoncer.
      e.preventDefault();
      if (e.repeat || pressedBtn) return;
      const focused = ui.overlay.contains(document.activeElement) && document.activeElement.tagName === 'BUTTON';
      pressedBtn = focused ? document.activeElement : state === 'select' || state === 'drivers' ? null : ui.overlay.querySelector('button:not([data-retry])');
      if (pressedBtn) pressedBtn.classList.add('is-pressed');
    }
  });
  let pressedBtn = null;
  window.addEventListener('keyup', (e) => {
    const k = e.key.toLowerCase();
    if ((k === ' ' || k === 'enter') && pressedBtn) {
      e.preventDefault();
      const b = pressedBtn;
      pressedBtn = null;
      b.classList.remove('is-pressed');
      b.click();
    }
  });
  // Glisser le doigt (ou la souris) vers la gauche ou la droite change d'un seul couloir ;
  // un simple appui ne fait rien, et il faut relâcher pour pouvoir glisser à nouveau.
  const SWIPE_PX = 28;
  let swipe = null;
  canvas.addEventListener('pointerdown', (e) => { swipe = { id: e.pointerId, x: e.clientX }; skipFinish(); });
  canvas.addEventListener('pointermove', (e) => {
    if (!swipe || swipe.done || e.pointerId !== swipe.id) return;
    const dx = e.clientX - swipe.x;
    if (Math.abs(dx) >= SWIPE_PX) { move(dx > 0 ? 1 : -1); swipe.done = true; }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach((t) => canvas.addEventListener(t, () => { swipe = null; }));
  $('padL').addEventListener('click', () => move(-1));
  $('padR').addEventListener('click', () => move(1));
  function toggleMute() {
    muted = !muted;
    ui.mute.classList.toggle('is-off', muted);
    const label = muted ? 'Activer le son' : 'Couper le son';
    ui.mute.setAttribute('aria-label', label);
    ui.mute.title = `${label} (M)`;
  }
  ui.mute.addEventListener('click', toggleMute);
  document.addEventListener('visibilitychange', () => { if (document.hidden && (state === 'race' || state === 'countdown')) togglePause(); });

  // ---------- Démarrage ----------
  resizeGame();
  buildThumbs();
  let savedDriver = null;
  try { savedDriver = localStorage.getItem(DRIVER_KEY); } catch { /* stockage indisponible */ }
  setDriver(savedDriver);
  buildLevel(0);
  hud();
  titleScreen();
  const start = () => requestAnimationFrame((t) => { last = t; frame(t); });
  if (document.fonts && document.fonts.load) document.fonts.load('10px "Press Start 2P"').then(start, start);
  else start();
})();
</script>
